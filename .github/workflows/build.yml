# .github/workflows/build.yml
name: Build Auction Sniper Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout repository -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4   # <-- upgraded to v4

      # ---- Set up Java ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4   # <-- upgraded to v4
        with:
          distribution: temurin
          java-version: 17

      # ---- Ensure gradlew is executable ----------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ---- Cache Gradle downloads ----------------------------------------------
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/**', 'gradlew') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---- Build the mod -------------------------------------------------------
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      # ---- Upload the compiled JAR ---------------------------------------------
      - name: Upload mod artifact
        uses: actions/upload-artifact@v4   # <-- upgraded to v4
        with:
          name: AuctionSniperMod
          path: build/libs/*.jar
          retention-days: 30
