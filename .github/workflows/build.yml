name: Build Auction Sniper Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Fabric Loom (Gradle plugin)
        run: |
          mkdir -p ~/.gradle/plugins
          curl -L https://maven.fabricmc.net/net/fabricmc/loom/net.fabricmc.loom.gradle.plugin/1.6-SNAPSHOT/net.fabricmc.loom.gradle.plugin-1.6-SNAPSHOT.jar -o ~/.gradle/plugins/net.fabricmc.loom.gradle.plugin-1.6-SNAPSHOT.jar

      - name: Build with Gradle (no local gradlew)
        run: |
          ./gradlew build || gradle build
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuctionSniper-Mod
          path: build/libs/
          retention-days: 30
