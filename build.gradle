plugins {
    id 'fabric-loom' version '1.5.10'  // Stable version instead of SNAPSHOT
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }  // Fabric's Maven repo
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.8+1.21.4"
    include(implementation('org.jetbrains:annotations:24.1.0'))
}

loom {
    accessWidenerPath = file("src/main/resources/auctionsniper.accesswidener")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        filter { it.replace("%VERSION%", project.version) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

jar {
    from("LICENSE") {
        into ""
    }
}
