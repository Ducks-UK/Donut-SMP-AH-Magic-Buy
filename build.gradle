plugins {
    id 'fabric-loom' version '1.3-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.4"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.14.22"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.86.1+1.20.4"
    include(implementation('com.google.code.gson:gson:2.10.1'))
}

loom {
    splitEnvironmentSourceSets = false
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        filter { it.replace("%VERSION%", project.version) }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "auction-sniper-mod"
            from components.java
        }
    }
}
