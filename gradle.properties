# Gradle properties for Auction Sniper Mod
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.unsafe.configuration-cache=true

# Fabric Loom configuration
fabric.loader.version=0.14.22
fabric.api.version=0.86.1+1.20.4
fabric.loader.mappings=official
fabric.api.mappings=intermediary

# Mod metadata
mod.id=auction-sniper-mod
mod.version=1.0.0
mod.description=Automated auction house sniper for DonutSMP
mod.authors=YourName
mod.license=MIT
mod.environment=client

# Minecraft version
minecraft.version=1.20.4
minecraft.mappings=1.20.4+build.4
minecraft.loader=fabric

# Dependency versions
gson.version=2.10.1
ahcharts.version=1.8.2-26.2

# Build configuration
build.dir=build
build.outputDir=build/libs
build.archiveBaseName=auction-sniper-mod
build.archiveClassifier=
build.archiveExtension=.jar
build.archiveVersion=

# Publishing configuration
maven.publish.group=com.example
maven.publish.artifact=auction-sniper-mod
maven.publish.version=1.0.0
